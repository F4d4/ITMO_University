# Стенд SDK-1.1MC.427, процессорный модуль STM32F427VIT6.
# Содержимое приведено в учебном пособии по стенду SDK-1.1M (раздел 4.5).
source [find SDK11M_FT.cfg]
set WORKAREASIZE 0x8000
transport select jtag
set CHIPNAME STM32F427VITx
set BOARDNAME SDK1_1_M
reset_config srst_only
set CONNECT_UNDER_RESET 1
source [find target/stm32f4x.cfg]

# Переменная CONNECT_UNDER_RESET выше - соглашение STM32CubeIDE; штатный
# сценарий target/stm32f4x.cfg её не читает. При работе с OpenOCD напрямую
# нужна настоящая команда, причём после подключения сценария цели, иначе
# она будет перекрыта. Без неё подключение к стенду с пустой флеш-памятью
# невозможно: ядро уходит в lockup по недействительному вектору сброса, и
# загрузчик программирования во внутреннее ОЗУ уже не записывается.
reset_config srst_only srst_nogate connect_assert_srst
