<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SOA. Лабораторная работа №1 — OpenAPI</title>
  <link rel="stylesheet" href="swagger-ui/swagger-ui.css">
  <link rel="icon" type="image/png" href="swagger-ui/favicon-32x32.png" sizes="32x32">
  <link rel="icon" type="image/png" href="swagger-ui/favicon-16x16.png" sizes="16x16">
  <style>
    html { box-sizing: border-box; }
    *, *:before, *:after { box-sizing: inherit; }
    body { margin: 0; background: #fafafa; }

    .lab-header {
      background: #1b1b1b;
      color: #fff;
      padding: 18px 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .lab-header h1 { margin: 0 0 6px; font-size: 20px; font-weight: 600; }
    .lab-header p { margin: 0; font-size: 14px; color: #bdbdbd; }
    .lab-header a { color: #89c4f4; }
  </style>
</head>
<body>

<div class="lab-header">
  <h1>Сервис-ориентированная архитектура — лабораторная работа №1</h1>
  <p>Спецификация OpenAPI 3.0 двух веб-сервисов: управление коллекцией объектов <code>Ticket</code>
     и сервис бронирования. Выберите спецификацию в списке справа сверху.</p>
</div>

<div id="swagger-ui"></div>

<script src="swagger-ui/swagger-ui-bundle.js" charset="UTF-8"></script>
<script src="swagger-ui/swagger-ui-standalone-preset.js" charset="UTF-8"></script>
<script>
  window.onload = function () {
    window.ui = SwaggerUIBundle({
      urls: [
        { name: "1. Ticket Service API", url: "ticket-service.yaml" },
        { name: "2. Booking Service API", url: "booking-service.yaml" }
      ],
      "urls.primaryName": "1. Ticket Service API",
      dom_id: "#swagger-ui",
      deepLinking: true,
      docExpansion: "list",
      defaultModelsExpandDepth: 2,
      defaultModelExpandDepth: 3,
      tryItOutEnabled: false,
      presets: [
        SwaggerUIBundle.presets.apis,
        SwaggerUIStandalonePreset
      ],
      plugins: [
        SwaggerUIBundle.plugins.DownloadUrl
      ],
      layout: "StandaloneLayout"
    });
  };
</script>

</body>
</html>
